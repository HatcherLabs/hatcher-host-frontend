<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1e"/>
      <stop offset="0.55" stop-color="#0d1428"/>
      <stop offset="1" stop-color="#0a1122"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <filter id="softer" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="130"/>
    </filter>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.9">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#9fb4ff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#base)"/>

  <g filter="url(#softer)">
    <ellipse cx="1450" cy="240" rx="620" ry="230" fill="#0ea5e9" fill-opacity="0.16" transform="rotate(-18 1450 240)"/>
    <ellipse cx="380" cy="880" rx="680" ry="260" fill="#7c3aed" fill-opacity="0.13" transform="rotate(-14 380 880)"/>
  </g>
  <g filter="url(#soft)">
    <ellipse cx="1050" cy="560" rx="520" ry="150" fill="#22d3ee" fill-opacity="0.07" transform="rotate(-20 1050 560)"/>
    <ellipse cx="620" cy="300" rx="380" ry="130" fill="#818cf8" fill-opacity="0.09" transform="rotate(-24 620 300)"/>
    <ellipse cx="1550" cy="820" rx="420" ry="150" fill="#2dd4bf" fill-opacity="0.06" transform="rotate(-12 1550 820)"/>
  </g>

  <rect width="1920" height="1080" fill="url(#dots)"/>
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
