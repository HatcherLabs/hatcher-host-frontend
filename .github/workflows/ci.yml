name: CI - Frontend

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  typecheck-and-build:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'hatcher-ci-frontend' }}
    timeout-minutes: 30
    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@hatcherlabs'
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test production service isolation
        run: ./scripts/test-service-isolation-permissions.sh

      - name: Test bounded incremental cache
        run: npm test -- __tests__/cache-handler.test.ts

      - name: Lint
        # ESLint runs against .eslintrc.json (next/core-web-vitals).
        # Next's own build runs lint internally too but we surface it
        # as a separate step so failures are obvious in the CI UI.
        run: npm run lint

      - name: Build frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.hatcher.host

      - name: Test production runtime routes and caches
        run: ./scripts/test-production-root-route.sh
